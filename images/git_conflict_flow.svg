    <text x="50" y="47" text-anchor="middle" fill="#22c55e" font-family="'Consolas', monospace" font-size="13" font-weight="700">7b1a03f</text>
    <text x="50" y="65" text-anchor="middle" fill="#86efac" font-family="'Inter', sans-serif" font-size="9">feature-update</text>
    <text x="50" y="110" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Sua dong 5 tren feature</text>
  </g>

  <!-- Merge Conflict Zone -->
  <g transform="translate(480, 195)">
    <rect width="170" height="110" rx="10" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="2"/>
    <text x="85" y="35" text-anchor="middle" fill="#ef4444" font-family="'Inter', sans-serif" font-size="13" font-weight="800">XUNG DOT GOP</text>
    <text x="85" y="58" text-anchor="middle" fill="#fca5a5" font-family="'Consolas', monospace" font-size="11">CONFLICT in</text>
    <text x="85" y="76" text-anchor="middle" fill="#fca5a5" font-family="'Consolas', monospace" font-size="11">README.md</text>
    <text x="85" y="98" text-anchor="middle" fill="#fef08a" font-family="'Inter', sans-serif" font-size="10">Xu ly thu cong</text>
