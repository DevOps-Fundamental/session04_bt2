  <path d="M405 135 L480 230" stroke="#ef4444" stroke-width="3"/>
  <path d="M405 365 L480 270" stroke="#22c55e" stroke-width="3"/>

  <!-- Merge Commit 9c4d21e -->
  <path d="M650 250 L750 250" stroke="#38bdf8" stroke-width="3"/>
  <g transform="translate(750, 200)">
    <circle cx="50" cy="50" r="36" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <text x="50" y="47" text-anchor="middle" fill="#38bdf8" font-family="'Consolas', monospace" font-size="13" font-weight="800">9c4d21e</text>
    <text x="50" y="65" text-anchor="middle" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="10">Merge Commit</text>
    <text x="50" y="110" text-anchor="middle" fill="#22c55e" font-family="'Inter', sans-serif" font-size="11">2 Nhanh to tien (Parents)</text>
