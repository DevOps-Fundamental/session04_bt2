<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%">
  <!-- Background -->
  <rect width="940" height="480" fill="rgb(15, 23, 42)" rx="10" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="940" height="42" fill="rgb(30, 41, 59)" rx="10"/>
  <rect y="32" width="940" height="10" fill="rgb(30, 41, 59)"/>
  <circle cx="22" cy="21" r="6" fill="#ef4444"/>
  <circle cx="40" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="58" cy="21" r="6" fill="#22c55e"/>
  <text x="320" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">
    Mo Hinh 3-Way Merge va Giai Quyet Xung Dot Nhanh
  </text>

  <!-- Base commit 1f5b42a -->
  <g transform="translate(60, 200)">
    <circle cx="50" cy="50" r="34" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="50" y="47" text-anchor="middle" fill="#38bdf8" font-family="'Consolas', monospace" font-size="13" font-weight="700">1f5b42a</text>
    <text x="50" y="65" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Base Commit</text>
    <text x="50" y="110" text-anchor="middle" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Commit goc chung</text>
  </g>

  <!-- Branch lines -->
  <path d="M145 235 L320 135" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M145 265 L320 365" stroke="#22c55e" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Main commit 3e8c91a -->
  <g transform="translate(320, 85)">
    <circle cx="50" cy="50" r="34" fill="#1e293b" stroke="#ef4444" stroke-width="3"/>
    <text x="50" y="47" text-anchor="middle" fill="#ef4444" font-family="'Consolas', monospace" font-size="13" font-weight="700">3e8c91a</text>
    <text x="50" y="65" text-anchor="middle" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="10">main</text>
    <text x="50" y="110" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Sua dong 5 tren main</text>
  </g>

  <!-- Feature commit 7b1a03f -->
  <g transform="translate(320, 315)">
